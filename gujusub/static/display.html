<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caption Display</title>
<style>
  :root {
    --bg: #000000;
    --text-color: #ffffff;
    --font: system-ui, "Noto Sans Gujarati", sans-serif;
    --size: 64px;
    --weight: 700;
    --lh: 1.3;
    --ls: 0px;
    --tt: none;
    --align: center;
    --pad: 5%;
    --bottom: 8%;
    --stroke-w: 0px;
    --stroke-c: #000000;
    --cap-shadow: none;
    --ar-w: 16;
    --ar-h: 9;
    --bar-w: 8px;
    --bar-c: #ffffff;
    --bar-h: 0px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body {
    background: var(--bg);
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }
  body.hide-chrome { cursor: none; }

  /* ---- Stage ---- */
  #app {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #stage {
    position: relative;
    width: min(100vw, calc(100vh * var(--ar-w) / var(--ar-h)));
    aspect-ratio: calc(var(--ar-w) / var(--ar-h));
  }

  /* ---- Caption (two-line clamp, bottom-anchored) ---- */
  #caption {
    position: absolute;
    left: var(--pad); right: var(--pad); bottom: var(--bottom);
    font-family: var(--font);
    font-size: var(--size);
    font-weight: var(--weight);
    line-height: var(--lh);
    letter-spacing: var(--ls);
    text-transform: var(--tt);
    text-align: var(--align);
    color: var(--text-color);
    opacity: 1;
    transition: opacity 0.6s ease;
  }
  #caption.faded { opacity: 0; }
  #caption.with-bar { padding-left: calc(var(--bar-w) + var(--size) * 0.4); }
  #bar {
    position: absolute; left: 0; bottom: 0;
    width: var(--bar-w); height: var(--bar-h);
    background: var(--bar-c);
    border-radius: calc(var(--bar-w) / 4);
  }
  #bar[hidden] { display: none; }
  .cap-block {
    display: flex; flex-direction: column; justify-content: flex-end;
    overflow: hidden;
  }
  .cap-block.lines-2 { height: calc(var(--size) * var(--lh) * 2); }
  .cap-block.lines-1 { height: calc(var(--size) * var(--lh) * 1); }
  .cap-block[hidden] { display: none; }
  /* Primary block: Gujarati uses the configured stack, English a Latin stack. */
  .cap-block.lang-en { font-family: var(--font), system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .cap-block span {
    display: block;  /* so its height is a whole number of line boxes */
    -webkit-text-stroke: var(--stroke-w) var(--stroke-c);
    paint-order: stroke fill;
    text-shadow: var(--cap-shadow);
    overflow-wrap: break-word;
  }

  /* ---- Chrome (auto-hiding UI) ---- */
  #chrome {
    position: fixed; top: 12px; right: 12px;
    display: flex; gap: 8px; z-index: 20;
    transition: opacity 0.3s ease;
  }
  #chrome button {
    width: 40px; height: 40px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(20,20,20,0.75);
    color: #eee; font-size: 20px; cursor: pointer;
  }
  #chrome button:hover { background: rgba(60,60,60,0.85); }
  #dot {
    position: fixed; left: 10px; bottom: 10px;
    width: 6px; height: 6px; border-radius: 50%;
    background: #e33; z-index: 20;
    transition: opacity 0.3s ease;
  }
  #dot.on { background: #2c2; }
  body.hide-chrome #chrome, body.hide-chrome #dot {
    opacity: 0; pointer-events: none;
  }

</style>
</head>
<body>

<div id="app">
  <div id="stage">
    <div id="caption">
      <div id="bar" hidden></div>
      <div id="primaryBlock" class="cap-block lang-gu lines-2" hidden><span id="primaryText"></span></div>
      <div id="transBlock" class="cap-block lines-2"><span id="transText"></span></div>
    </div>
  </div>
</div>

<div id="chrome">
  <button id="fsBtn" title="Fullscreen (f)">&#x26F6;</button>
</div>
<div id="dot"></div>

<script>
"use strict";
(function () {
  var $ = function (id) { return document.getElementById(id); };

  /* ---------------- Settings ----------------
     gujusub/settings.py is the source of truth. The server pushes the full
     display settings on /ws/view (first message, and on every change); this
     page holds no UI for them and stores nothing locally.
     DEFAULTS must match the server defaults, and SCHEMA the server schema.
     Precedence: server-pushed > URL params (old OBS links) > DEFAULTS. */
  var SCHEMA = 3;
  var DEFAULTS = {
    aspect: "16:9",          // stage aspect ratio
    mode: "translation",     // primary (ASR text) | translation | both
    stable: false,           // ignore tail (stable-only)
    clear: 6,                // seconds of silence before fade, 0 = never
    font: 'system-ui, "Noto Sans Gujarati", sans-serif',
    size: 64,                // px (maximum; text auto-shrinks to fit)
    minsize: 36,             // px floor for auto-shrink; below this it wraps/scrolls
    weight: 700,
    lh: 1.3,
    ls: 0,                   // px
    tt: "none",              // none | uppercase | lowercase | capitalize
    color: "#ffffff",
    ow: 0,                   // outline width px
    oc: "#000000",           // outline color
    shadow: false,           // use text-shadow instead of stroke
    bg: "#000000",           // hex or "transparent"
    align: "left",           // left reads better while text is still growing
    pad: 5,                  // horizontal padding, % of stage width
    bottom: 8,               // bottom margin, % of stage height
    bar: true,               // vertical bar beside live captions
    barw: 8,                 // bar width px
    barc: "#ffffff"
  };
  var LEGACY_MODE = { gu: "primary", en: "translation" };
  var MODES = { primary: 1, translation: 1, both: 1 };
  var urlSettings = {};
  var settings = Object.assign({}, DEFAULTS);

  function normMode(v) {
    if (LEGACY_MODE.hasOwnProperty(v)) v = LEGACY_MODE[v];
    return MODES.hasOwnProperty(v) ? v : null;
  }
  function loadFromUrl() {
    var p = new URLSearchParams(location.search);
    Object.keys(DEFAULTS).forEach(function (k) {
      if (!p.has(k)) return;
      var v = p.get(k);
      var t = typeof DEFAULTS[k];
      if (k === "mode") { var m = normMode(v); if (m) urlSettings.mode = m; }
      else if (t === "boolean") urlSettings[k] = (v === "1" || v === "true");
      else if (t === "number") { var n = parseFloat(v); if (isFinite(n)) urlSettings[k] = n; }
      else if (v !== "") urlSettings[k] = v;
    });
  }
  // Overlay a server message on top of URL params and defaults.
  var serverSettings = {};
  function ingestServerSettings(msg) {
    if (msg.schema > SCHEMA)
      console.warn("server settings schema " + msg.schema + " > page schema " + SCHEMA +
                   "; applying the keys this page understands");
    Object.keys(DEFAULTS).forEach(function (k) {
      if (!(k in msg) || typeof msg[k] !== typeof DEFAULTS[k]) return;
      if (k === "mode") { var m = normMode(msg.mode); if (m) serverSettings.mode = m; }
      else serverSettings[k] = msg[k];
    });
    settings = Object.assign({}, DEFAULTS, urlSettings, serverSettings);
    applySettings();
    render(true);
  }

  /* ---------------- Apply settings -> CSS vars & DOM ---------------- */
  function applySettings() {
    var r = document.documentElement.style;
    var parts = settings.aspect.split(":");
    var arW = parseFloat(parts[0]), arH = parseFloat(parts[1]);
    if (!isFinite(arW) || !isFinite(arH) || arW <= 0 || arH <= 0) { arW = 16; arH = 9; }
    r.setProperty("--ar-w", arW);
    r.setProperty("--ar-h", arH);
    r.setProperty("--bg", settings.bg);
    r.setProperty("--text-color", settings.color);
    r.setProperty("--font", settings.font);
    r.setProperty("--size", settings.size + "px");
    r.setProperty("--weight", settings.weight);
    r.setProperty("--lh", settings.lh);
    r.setProperty("--ls", settings.ls + "px");
    r.setProperty("--tt", settings.tt);
    r.setProperty("--align", settings.align);
    r.setProperty("--pad", settings.pad + "%");
    r.setProperty("--bottom", settings.bottom + "%");
    r.setProperty("--stroke-c", settings.oc);
    r.setProperty("--bar-w", settings.barw + "px");
    r.setProperty("--bar-c", settings.barc);
    $("caption").classList.toggle("with-bar", settings.bar);
    if (settings.shadow) {
      r.setProperty("--stroke-w", "0px");
      r.setProperty("--cap-shadow", buildShadow(settings.ow, settings.oc));
    } else {
      r.setProperty("--stroke-w", settings.ow + "px");
      r.setProperty("--cap-shadow", "none");
    }
  }
  function buildShadow(w, c) {
    if (!w || w <= 0) return "none";
    var out = [];
    [-w, 0, w].forEach(function (x) {
      [-w, 0, w].forEach(function (y) {
        if (x !== 0 || y !== 0) out.push(x + "px " + y + "px 0 " + c);
      });
    });
    out.push("0 0 " + w + "px " + c);
    return out.join(", ");
  }

  /* ---------------- Fullscreen ---------------- */
  function toggleFullscreen() {
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(function () {});
    } else {
      document.documentElement.requestFullscreen().catch(function () {});
    }
  }
  $("fsBtn").addEventListener("click", toggleFullscreen);
  $("stage").addEventListener("dblclick", toggleFullscreen);
  document.addEventListener("keydown", function (e) {
    if (e.key === "f" || e.key === "F") toggleFullscreen();
  });

  /* ---------------- Auto-hiding chrome ---------------- */
  var chromeTimer = null;
  function showChrome() {
    document.body.classList.remove("hide-chrome");
    clearTimeout(chromeTimer);
    chromeTimer = setTimeout(function () {
      document.body.classList.add("hide-chrome");
    }, 3000);
  }
  document.addEventListener("mousemove", showChrome);
  document.addEventListener("mousedown", showChrome);
  showChrome();

  /* ---------------- Caption state & rendering ---------------- */
  var state = { uid: null, lang: "gu", committed: "", tail: "", translation: "" };
  var caption = $("caption");
  var clearTimer = null;

  // Last text/layout actually rendered; lets render() skip identical frames.
  // Both the primary text and the translation are compared, so a repeated
  // partial with the same text but a new translation still re-renders.
  var lastPrimary = null, lastTrans = null, lastLang = null;

  // force=true (settings/resize changes) re-fits even if the text is unchanged.
  function render(force) {
    var primary = state.committed;
    if (!settings.stable && state.tail)
      primary = primary ? primary + " " + state.tail : state.tail;
    var trans = state.translation;
    if (!force && primary === lastPrimary && trans === lastTrans &&
        state.lang === lastLang) return;
    // translation mode with nothing translated yet: show the primary text
    // so the screen is never blank.
    var both = settings.mode === "both";
    var showTrans = both || (settings.mode === "translation" && trans !== "");
    var showPrimary = both || settings.mode === "primary" ||
                      (settings.mode === "translation" && trans === "");
    var pB = $("primaryBlock"), tB = $("transBlock");
    pB.hidden = !showPrimary;
    tB.hidden = !showTrans;
    pB.className = "cap-block lang-" + state.lang + " " + (both ? "lines-1" : "lines-2");
    tB.className = "cap-block " + (both ? "lines-1" : "lines-2");
    // Block limits are CSS-fixed (N line boxes), read before dirtying the DOM.
    var limits = blockLimits();
    lastPrimary = primary; lastTrans = trans; lastLang = state.lang;
    $("primaryText").textContent = primary;
    $("transText").textContent = trans;
    fitText(limits);
  }

  // Events can arrive faster than frames; handleEvent only updates state and
  // this renders at most once per animation frame (latest state wins).
  var rafPending = false;
  function scheduleRender() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(function () { rafPending = false; render(false); });
  }

  function blockLimits() {
    return [$("primaryBlock"), $("transBlock")].map(function (block) {
      return block.hidden ? 0 : block.clientHeight + 0.5;
    });
  }

  // Shrink each visible block's text until it fits its line limit, stopping
  // at settings.minsize. The block keeps its full-size height, so nothing
  // else moves; if the floor is hit the text simply wraps and is clipped.
  // Layout passes per block: 1 if the full size fits (common case); 2 if even
  // the min size overflows; otherwise 2 + at most 4 bisection steps = 6.
  function fitText(limits) {
    limits = limits || blockLimits();
    var textHeight = 0;
    [$("primaryBlock"), $("transBlock")].forEach(function (block, idx) {
      if (block.hidden) return;
      var span = block.firstElementChild;
      var limit = limits[idx];
      span.style.fontSize = "";
      if (!span.textContent) return;
      var h = span.getBoundingClientRect().height;       // pass 1: max size
      if (h > limit) {
        var hi = settings.size, lo = Math.min(settings.minsize, hi);
        span.style.fontSize = lo + "px";
        h = span.getBoundingClientRect().height;         // pass 2: min size
        if (h <= limit) {
          var hLo = h;
          for (var i = 0; i < 4; i++) {                  // passes 3..6
            var mid = (lo + hi) / 2;
            span.style.fontSize = mid + "px";
            var hm = span.getBoundingClientRect().height;
            if (hm <= limit) { lo = mid; hLo = hm; } else hi = mid;
          }
          span.style.fontSize = lo + "px";
          h = hLo;
        }
      }
      textHeight += Math.min(h, block.clientHeight);
    });
    // The bar spans exactly the text currently on screen (blocks are
    // bottom-anchored, so it grows upward from the last line).
    $("bar").hidden = !settings.bar || textHeight === 0;
    caption.style.setProperty("--bar-h", textHeight + "px");
  }
  window.addEventListener("resize", function () { render(true); });
  function armClearTimer() {
    caption.classList.remove("faded");
    clearTimeout(clearTimer);
    if (settings.clear > 0) {
      clearTimer = setTimeout(function () {
        caption.classList.add("faded");
      }, settings.clear * 1000);
    }
  }
  function handleEvent(msg) {
    if (!msg || (msg.type !== "partial" && msg.type !== "final")) return;
    if (msg.utterance_id !== state.uid) {
      state.uid = msg.utterance_id;
      state.committed = "";
      state.tail = "";
      state.translation = "";
    }
    state.lang = msg.lang === "en" ? "en" : "gu";  // missing lang = Gujarati
    if (typeof msg.committed === "string") state.committed = msg.committed;
    state.tail = (msg.type === "final") ? "" : (typeof msg.tail === "string" ? msg.tail : "");
    if (typeof msg.translation === "string")
      state.translation = msg.translation;
    scheduleRender();
    armClearTimer();
  }

  /* ---------------- WebSocket client (receive-only, auto-reconnect) ---------- */
  var dot = $("dot");
  var ws = null;
  var backoff = 1000;
  var BACKOFF_MAX = 10000;

  function connect() {
    var proto = location.protocol === "https:" ? "wss" : "ws";
    var url = proto + "://" + location.host + "/ws/view";
    try { ws = new WebSocket(url); } catch (e) { scheduleReconnect(); return; }
    ws.onopen = function () {
      backoff = 1000;
      dot.classList.add("on");
    };
    ws.onmessage = function (ev) {
      if (typeof ev.data !== "string") return;
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg && msg.type === "settings") ingestServerSettings(msg);
      else handleEvent(msg);
    };
    ws.onclose = function () {
      dot.classList.remove("on");
      scheduleReconnect();
    };
    ws.onerror = function () {
      try { ws.close(); } catch (e) {}
    };
  }
  function scheduleReconnect() {
    setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, BACKOFF_MAX);
  }

  /* ---------------- Init ---------------- */
  loadFromUrl();
  settings = Object.assign({}, DEFAULTS, urlSettings);
  applySettings();
  render(true);
  connect();
})();
</script>
</body>
</html>
